name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ffprobe_retain_artifacts:
        description: 'Source-check mode only: retain validated helper/source inputs for 2-day review; no publication'
        type: boolean
        default: false
      ffprobe_source_check:
        description: 'Only build pinned FFprobe source and validate exact artifacts; no publication'
        type: boolean
        default: false
      ffprobe_candidate_check:
        description: 'Only validate pinned FFprobe candidates in disposable native packages; no publication'
        type: boolean
        default: false
      package_check:
        description: 'Also build and verify native installers without publishing'
        type: boolean
        default: false
      local_media_check:
        description: 'Require published FFprobe and validate packaged local media (also enable package_check)'
        type: boolean
        default: false
      stage_linux_helpers:
        description: 'Validate upstream Linux helpers instead of running app checks'
        type: boolean
        default: false
      publish_linux_helpers:
        description: 'Add validated Linux helpers to the existing binaries release (staging mode only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-ffprobe-source:
    if: github.event_name == 'workflow_dispatch' && inputs.ffprobe_source_check && !inputs.ffprobe_candidate_check
    uses: ./.github/workflows/validate-ffprobe-source.yml
    with:
      retain_artifacts: ${{ inputs.ffprobe_retain_artifacts }}

  validate-ffprobe-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.ffprobe_candidate_check
    uses: ./.github/workflows/validate-ffprobe-candidate.yml

  stage-linux-helpers:
    if: github.event_name == 'workflow_dispatch' && inputs.stage_linux_helpers && !inputs.ffprobe_candidate_check && !inputs.ffprobe_source_check
    permissions:
      contents: write
    uses: ./.github/workflows/stage-linux-helpers.yml
    with:
      publish: ${{ inputs.publish_linux_helpers }}

  check:
    if: ${{ !inputs.stage_linux_helpers && !inputs.ffprobe_candidate_check && !inputs.ffprobe_source_check }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.package_check && 60 || 20 }}
    env:
      CLIPLY_REQUIRE_FFPROBE: ${{ inputs.local_media_check && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: darwin-arm64
            builder: --mac
            resources: dist/mac-arm64/Cliply.app/Contents/Resources
          - os: windows-latest
            platform: win32-x64
            builder: --win
            resources: dist/win-unpacked/resources
          - os: ubuntu-24.04
            platform: linux-x64
            builder: --linux
            resources: dist/linux-unpacked/resources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            src/main/renderer/package-lock.json

      - name: Validate local-media package request
        if: inputs.local_media_check && !inputs.package_check
        run: node -e "throw new Error('local_media_check requires package_check=true')"

      - run: npm ci
      # Electron 42+ downloads on first use, not during npm ci. Finish that
      # before Jest workers can require the package and start competing installs.
      - name: Install Electron runtime
        run: npx --no-install install-electron --no
      - run: npm run install:renderer

      - name: Lint main
        run: npm run lint

      # The main suite asserts posix file modes and process-group signals
      # (the win32 code paths have their own branches), so it runs on POSIX hosts.
      - name: Test main
        if: runner.os != 'Windows'
        run: npm test

      - name: Test download recovery on Windows
        if: runner.os == 'Windows'
        run: npm test -- --runInBand tests/download-recovery.test.js tests/error-taxonomy.test.js

      - name: Test renderer
        run: npm run test:renderer

      # tsc -b then vite build: the same step the release build runs before packaging
      - name: Build renderer
        run: npm run build:renderer

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 weston libgtk-3-0t64 libasound2t64 libgbm1 libnss3

      - name: Smoke test Electron startup, preload and renderer
        if: runner.os != 'Linux'
        run: npm run smoke:electron

      - name: Smoke test Linux startup, preload and renderer
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum npm run smoke:electron
        env:
          CLIPLY_SMOKE_NO_SANDBOX: '1'

      # Run explicitly for runtime/tooling upgrades. Keep the ordinary PR check
      # quick, and never use the publishing release workflow for validation.
      - name: Download release helpers
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: node scripts/fetch-helpers.js --platform ${{ matrix.platform }}

      - name: Fetch release yt-dlp engine
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: npm run fetch:ytdlp
        env:
          BUILD_TARGET_PLATFORM: ${{ matrix.platform }}

      - name: Build installers without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: npx --no-install electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify downloads and recovery with real release helpers
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: node scripts/smoke-download-recovery.js --resources "${{ matrix.resources }}" ${{ inputs.local_media_check && '--local-media' || '' }}

      - name: Verify native media formats with packaged helpers
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: node scripts/smoke-media.js --resources "${{ matrix.resources }}"

      - name: Verify packaged helper executables
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        run: node scripts/verify-packaged-helpers.js --resources "${{ matrix.resources }}"

      - name: Verify packaged local media offline
        if: github.event_name == 'workflow_dispatch' && inputs.package_check && inputs.local_media_check && runner.os != 'Linux'
        run: node scripts/smoke-packaged-local-media.js --resources "${{ matrix.resources }}"

      - name: Verify packaged local media offline on Linux
        if: github.event_name == 'workflow_dispatch' && inputs.package_check && inputs.local_media_check && runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/smoke-packaged-local-media.js --resources "${{ matrix.resources }}"

      - name: Verify Linux AppImage launcher and installed DEB
        if: github.event_name == 'workflow_dispatch' && inputs.package_check && runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/smoke-packaged-linux.js

      - name: Validate final installed artifact payloads
        if: github.event_name == 'workflow_dispatch' && inputs.package_check && runner.os != 'Linux'
        run: node scripts/smoke-installed-artifacts.js --resources "${{ matrix.resources }}" --evidence "${{ runner.temp }}/cliply-installed-artifacts.json" ${{ inputs.local_media_check && '--local-media' || '' }}

      - name: Validate final installed artifact payloads on Linux
        if: github.event_name == 'workflow_dispatch' && inputs.package_check && runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/smoke-installed-artifacts.js --resources "${{ matrix.resources }}" --evidence "${{ runner.temp }}/cliply-installed-artifacts.json" ${{ inputs.local_media_check && '--local-media' || '' }}

      - name: Upload final installer verification evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.package_check
        uses: actions/upload-artifact@v4
        with:
          name: installed-artifact-evidence-${{ runner.os }}
          path: ${{ runner.temp }}/cliply-installed-artifacts.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validation installers
        if: github.event_name == 'workflow_dispatch' && inputs.package_check
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  verify-release-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.package_check && !inputs.stage_linux_helpers
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: validation-*
          path: artifacts
      - name: Validate all installer attachments and real update manifests
        run: node scripts/verify-release-artifacts.js artifacts
