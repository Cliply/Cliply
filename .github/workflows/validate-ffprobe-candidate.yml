name: Validate FFprobe candidates

# Read-only, prepublication native evidence. No release or artifact containing
# executables. The exact candidate pins are reviewed source inputs.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx --no-install install-electron --no
      - run: npm run install:renderer
      - run: npm run build:renderer
      - run: node scripts/fetch-helpers.js --platform ${{ matrix.platform }}
      - run: npm run fetch:ytdlp
        env:
          BUILD_TARGET_PLATFORM: ${{ matrix.platform }}
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 libgtk-3-0t64 libasound2t64 libgbm1 libnss3
      - name: Native candidate checks
        if: runner.os != 'Linux'
        run: node scripts/validate-ffprobe-candidate.js --evidence "${{ runner.temp }}/candidate-evidence"
      - name: Linux native candidate checks
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/validate-ffprobe-candidate.js --evidence "${{ runner.temp }}/candidate-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/candidate-evidence
          retention-days: 7
          if-no-files-found: warn
